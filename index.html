<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FriendSpace</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f0f4f8;color:#222}
header{background:#1877f2;color:white;padding:18px;text-align:center;font-size:25px;font-weight:bold}
main{max-width:600px;margin:auto;padding:15px}
.card{background:white;padding:18px;margin:15px 0;border-radius:12px;box-shadow:0 2px 8px #ddd}
input,textarea,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ddd;box-sizing:border-box;font-size:16px}
button{background:#1877f2;color:white;border:none;font-weight:bold;cursor:pointer}
button.secondary{background:#555}
.post{background:white;padding:15px;margin:15px 0;border-radius:12px}
small{color:#777}
#feed{margin-top:15px}
</style>
</head>
<body>
<header>🌎 FriendSpace</header>
<main>
<div class="card" id="auth">
<h2>Welcome to FriendSpace</h2>
<input id="username" placeholder="Username (for sign up)">
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">
<button onclick="signup()">Create Account</button>
<button class="secondary" onclick="login()">Log In</button>
<p id="message"></p>
</div>

<div id="app" style="display:none">
<div class="card">
<h2 id="welcome"></h2>
<button class="secondary" onclick="logout()">Log Out</button>
 <h3>My Profile Photo</h3><input type="text" id="fullName" placeholder="Your full name"><h3>Find Friends</h3>
<input type="text" id="searchUser" placeholder="Search username">
<button onclick="searchUsers()">Search</button>
<div id="searchResults"></div>
<textarea id="bio" placeholder="Write your bio"></textarea>
<button onclick="updateProfile()">Save Profile</button>
<input type="file" id="avatarFile" accept="image/*">
<button onclick="uploadAvatar()">Upload Profile Photo</button>
<img id="avatarPreview" width="120" style="border-radius:50%;display:none;">
</div>
<div class="card">
<h3>Create a post</h3>
<textarea id="postContent" placeholder="What's on your mind?" rows="4"></textarea>
<button onclick="createPost()">Post</button>
</div>
<h2>Community Feed</h2>
<div id="feed">Loading posts...</div>
</div>
</main>
<script>
const SUPABASE_URL = "https://rtkehyswdsztzequfqfj.supabase.co";
const SUPABASE_KEY = "sb_publishable_Ftk2HJc55yRtsGRSQkGA5A_A2JQeHnb";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser = null;

async function signup(){
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 const username=document.getElementById('username').value.trim();
 if(!username||!email||!password){message("Fill in all fields.");return;}
 const {data,error}=await db.auth.signUp({email,password,options:{data:{username}}});
 if(error){message(error.message);return;}
 if(data.user && data.session){
  await saveProfile(data.user,username);
  message("Account created!");
  showApp(data.user);
 }else{
  message("Account created! Check your email to confirm, then log in.");
 }
}

async function login(){
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){message(error.message);return;}
 currentUser=data.user;
 await ensureProfile(currentUser);
 showApp(currentUser);
}

async function saveProfile(user,username){
 const {error}=await db.from('profiles').insert({id:user.id,username:username});
 if(error && !error.message.includes("duplicate"))console.log(error.message);
}

async function ensureProfile(user){
 const {data}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();
 if(!data){
  const username=user.user_metadata?.username || user.email.split('@')[0];
  await saveProfile(user,username);
 }
}

async function loadAvatar(){
 const {data,error}=await db
  .from('profiles')
  .select('avatar_url')
  .eq('id',currentUser.id)
  .maybeSingle();

 if(error){
  console.log(error.message);
  return;
 }

 const preview=document.getElementById('avatarPreview');
 if(data && data.avatar_url){
  preview.src=data.avatar_url;
  preview.style.display='block';
 }
}
 function showApp(user){
 currentUser=user;
 document.getElementById('auth').style.display='none';
 document.getElementById('app').style.display='block';
 document.getElementById('welcome').textContent="Welcome to FriendSpace!";
 loadAvatar();
 loadPosts();
}
function message(text){
 document.getElementById('message').textContent=text;
}

async function createPost(){
 const content=document.getElementById('postContent').value.trim();
 if(!content)return alert("Write something first!");
 const {error}=await db.from('posts').insert({user_id:currentUser.id,content});
 if(error){alert(error.message);return;}
 document.getElementById('postContent').value='';
 loadPosts();
}

async function loadPosts(){
 const {data,error}=await db.from('posts').select('*').order('created_at',{ascending:false});
 if(error){document.getElementById('feed').textContent=error.message;return;}

 const feed=document.getElementById('feed');
 feed.innerHTML='';

 for(const post of data){
  const {data:profile}=await db.from('profiles').select('username').eq('id',post.user_id).maybeSingle();
  const {data:likes}=await db.from('likes').select('id').eq('post_id',post.id);
  const {data:comments}=await db.from('comments').select('*').eq('post_id',post.id).order('created_at',{ascending:true});

  const div=document.createElement('div');
  div.className='post';

  const name=document.createElement('strong');
  name.textContent=profile?.username || 'FriendSpace user';

  const content=document.createElement('p');
  content.textContent=post.content;

  const date=document.createElement('small');
  date.textContent=new Date(post.created_at).toLocaleString();

  const likeButton=document.createElement('button');
  likeButton.textContent="❤️ Like ("+(likes?.length || 0)+")";
  likeButton.onclick=()=>toggleLike(post.id);

  const commentBox=document.createElement('input');
  commentBox.placeholder="Write a comment...";

  const commentButton=document.createElement('button');
  commentButton.textContent="Comment";
  commentButton.onclick=()=>addComment(post.id,commentBox.value);

  const commentList=document.createElement('div');
  for(const comment of (comments || [])){
   const {data:commentProfile}=await db.from('profiles').select('username').eq('id',comment.user_id).maybeSingle();
   const p=document.createElement('p');
   p.textContent=(commentProfile?.username || 'User')+": "+comment.content;
   commentList.appendChild(p);
  }

  div.append(name,content,date,likeButton,commentBox,commentButton,commentList);
  feed.appendChild(div);
 }
}

async function toggleLike(postId){
 const {data}=await db.from('likes').select('id').eq('post_id',postId).eq('user_id',currentUser.id).maybeSingle();

 if(data){
  const {error}=await db.from('likes').delete().eq('id',data.id);
  if(error){alert(error.message);return;}
 }else{
  const {error}=await db.from('likes').insert({post_id:postId,user_id:currentUser.id});
  if(error){alert(error.message);return;}
 }
 loadPosts();
}

async function addComment(postId,text){
 const content=text.trim();
 if(!content){alert("Write a comment first.");return;}

 const {error}=await db.from('comments').insert({post_id:postId,user_id:currentUser.id,content});
 if(error){alert(error.message);return;}

 loadPosts();
}
 async function searchUsers(){
 const term=document.getElementById('searchUser').value.trim();
 const results=document.getElementById('searchResults');
 results.innerHTML='';

 if(!term){
  results.textContent="Enter a username to search.";
  return;
 }

 const {data,error}=await db.from('profiles')
  .select('id,username,full_name')
  .ilike('username','%'+term+'%')
  .neq('id',currentUser.id);

 if(error){
  results.textContent=error.message;
  return;
 }

 if(!data.length){
  results.textContent="No users found.";
  return;
 }

 for(const user of data){
  const div=document.createElement('div');
  div.className='post';

  const name=document.createElement('strong');
  name.textContent=user.full_name || user.username;

  const button=document.createElement('button');
  button.textContent="Follow";
  button.onclick=()=>followUser(user.id);

  div.append(name,button);
  results.appendChild(div);
 }
}

async function followUser(userId){
 const {error}=await db.from('follows').insert({
  follower_id:currentUser.id,
  following_id:userId
 });

 if(error){
  if(error.code==='23505'){
   alert("You're already following this user.");
  }else{
   alert(error.message);
  }
  return;
 }

 alert("User followed successfully! ❤️");
}
async function uploadAvatar(){
 const file=document.getElementById('avatarFile').files[0];

 if(!file){
  alert("Please choose a photo first.");
  return;
 }

 const filePath=currentUser.id+"/"+Date.now()+"."+file.name.split('.').pop();

 const {error}=await db.storage.from('avatars').upload(filePath,file);

 if(error){
  alert(error.message);
  return;
 }

 const {data}=db.storage.from('avatars').getPublicUrl(filePath);
 const avatarUrl=data.publicUrl;

 const {error:updateError}=await db.from('profiles').update({avatar_url:avatarUrl}).eq('id',currentUser.id);

 if(updateError){
  alert(updateError.message);
  return;
 }

 const preview=document.getElementById('avatarPreview');
 preview.src=avatarUrl;
 preview.style.display='block';

 alert("Profile photo uploaded successfully!");
}
async function logout(){
 await db.auth.signOut();
 currentUser=null;
 document.getElementById('auth').style.display='block';
 document.getElementById('app').style.display='none';
}

db.auth.onAuthStateChange(async(event,session)=>{
 if(session && !currentUser){
  currentUser=session.user;
  showApp(session.user);
 }
});
</script>
</body>
</html>
